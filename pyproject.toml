[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laliga-match-forecasting"
version = "0.2.0"
description = "Reproducible, leakage-safe LaLiga match forecasting data and baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<23",
  "requests>=2.31,<3",
  "scikit-learn>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
